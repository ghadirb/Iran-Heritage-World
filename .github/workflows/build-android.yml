name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - "app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  android:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot --headless --editor --path app --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path app --export-debug "Android" build/IranHeritageWorld-debug.apk
          test -s build/IranHeritageWorld-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IranHeritageWorld-debug-apk
          path: build/IranHeritageWorld-debug.apk
          if-no-files-found: error
          retention-days: 14
