name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot --headless --editor --path app --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path app --export-debug "Android" build/IranHeritageWorld-debug.apk
          test -s build/IranHeritageWorld-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IranHeritageWorld-debug-apk
          path: build/IranHeritageWorld-debug.apk
          if-no-files-found: error
          retention-days: 14
