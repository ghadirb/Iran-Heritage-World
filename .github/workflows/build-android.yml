name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - "app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  android:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify Android toolchain paths
        shell: bash
        run: |
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -x "$JAVA_HOME/bin/java"

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app"
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/app/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GITHUB_WORKSPACE/app/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          preset = Path("app/export_presets.cfg")
          data = preset.read_text()
          data = data.replace('keystore/debug="res://debug.keystore"', f'keystore/debug="{Path("app/debug.keystore").resolve()}"')
          preset.write_text(data)
          print("Configured absolute debug keystore path in Android export preset.")
          PY

      - name: Import project
        run: godot --headless --editor --path app --quit

      - name: Export debug APK
        run: |
          # With --path app, Godot writes the preset-relative export path inside app/.
          mkdir -p app/build
          godot --headless --verbose --path app --export-debug "Android" build/IranHeritageWorld-debug.apk
          test -s app/build/IranHeritageWorld-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IranHeritageWorld-debug-apk
          path: app/build/IranHeritageWorld-debug.apk
          if-no-files-found: error
          retention-days: 14
