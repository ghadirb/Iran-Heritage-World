; Android export preset for development builds.
; Signing: CI injects the permanent key through GODOT_ANDROID_KEYSTORE_* environment variables (GitHub Secrets).
; Never put a keystore or a password in this file. See documentation/android-signing.md.
[preset.0]
name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="video/*.ogv"
exclude_filter=""
export_path="build/IranHeritageWorld-debug.apk"

[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
version/code=1
version/name="0.1.0"
package/unique_name="org.maliar.iranheritage"
package/name="Iran Heritage World"
package/signed=true
keystore/debug="res://debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
screen/immersive_mode=true
screen/orientation=0
